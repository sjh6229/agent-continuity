name: Privacy scan

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  privacy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run privacy scan
        run: python scripts/privacy-scan.py .
